<!DOCTYPE html>
<html>
<head>
<title>🔥 TOM X JERRY ARENA 🔥</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
box-sizing:border-box;
font-family:Arial;
}

body{
margin:0;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:radial-gradient(circle,#ff0000,#000);
color:white;
}

.container{
width:95%;
max-width:420px;
background:#111;
padding:20px;
border-radius:20px;
box-shadow:0 0 25px red;
text-align:center;
}

h1{
color:#ffcc00;
}

input,button{
width:100%;
padding:13px;
margin:8px 0;
border:none;
border-radius:10px;
}

input{
background:#222;
color:white;
}

button{
background:linear-gradient(45deg,red,orange);
color:white;
font-weight:bold;
}

.hide{
display:none;
}

</style>

</head>

<body>


<div class="container">


<div id="home">

<h1>🔥 TOM X JERRY ARENA 🔥</h1>

<p>Free Fire Tournament Platform</p>


<button onclick="openPlayer()">
🎮 PLAYER LOGIN
</button>


<button onclick="openAdmin()">
👑 ADMIN LOGIN
</button>

</div>



<div id="playerLogin" class="hide">

<h1>🎮 PLAYER LOGIN</h1>

<input id="pName" placeholder="Player Name">

<input id="pUID" placeholder="Free Fire UID">


<button onclick="loginPlayer()">
LOGIN
</button>

</div>



<div id="adminLogin" class="hide">

<h1>👑 ADMIN LOGIN</h1>

<input id="user" placeholder="Username">

<input id="pass" placeholder="Password">


<button onclick="loginAdmin()">
LOGIN
</button>

</div>



<div id="playerPanel" class="hide">

<h1>🔥 PLAYER PANEL 🔥</h1>

<h2 id="showName"></h2>

<p id="showUID"></p>

<p id="showCoins"></p>

<button onclick="showTournament()">
🏆 TOURNAMENT
</button>
  <button onclick="viewRooms()">
⭐ STAR ROOM
  </button>
<button onclick="joinTournament()">
🎮 JOIN TOURNAMENT
</button>
  
<div id="tournamentData"></div>
<button onclick="logout()">
🚪 LOGOUT
</button>

</div>



<div id="adminPanel" class="hide">

<h1>👑 ADMIN PANEL</h1>

<p>Admin Login Successful</p>

<button onclick="viewPlayers()">
👥 VIEW PLAYERS
</button>
<button onclick="addCoinsBox()">
💰 ADD COINS
</button>
  <button onclick="createTournamentBox()">
🏆 CREATE TOURNAMENT
  </button>
  <button onclick="viewJoinedPlayers()">
👥 JOINED PLAYERS
  </button>
  <button onclick="matchResultBox()">
🏆 MATCH RESULT
  </button>
  <button onclick="viewWinners()">
🏆 VIEW WINNERS
  </button>
  <button onclick="createRoomBox()">
⭐ CREATE STAR ROOM
  </button>
  <button onclick="manageTournament()">
⚙️ MANAGE TOURNAMENT
  </button>
  
<div id="adminData"></div>

<button onclick="logout()">
🚪 LOGOUT
</button>

</div>


</div>



<script>


function hideAll(){

document.getElementById("home").classList.add("hide");

document.getElementById("playerLogin").classList.add("hide");

document.getElementById("adminLogin").classList.add("hide");

document.getElementById("playerPanel").classList.add("hide");

document.getElementById("adminPanel").classList.add("hide");

}



function openPlayer(){

hideAll();

document.getElementById("playerLogin").classList.remove("hide");

}



function openAdmin(){

hideAll();

document.getElementById("adminLogin").classList.remove("hide");

}



function loginPlayer(){

let name=document.getElementById("pName").value;

let uid=document.getElementById("pUID").value;


if(name=="" || uid==""){

alert("Fill Details");

return;

}


let player={
name:name,
uid:uid,
coins:100
};


localStorage.setItem(
"player",
JSON.stringify(player)
);
let players =
JSON.parse(localStorage.getItem("players")) || [];

players.push(player);

localStorage.setItem(
"players",
JSON.stringify(players)
);


hideAll();

document.getElementById("playerPanel").classList.remove("hide");


document.getElementById("showName").innerHTML=
"👤 "+player.name;


document.getElementById("showUID").innerHTML=
"UID: "+player.uid;


document.getElementById("showCoins").innerHTML=
"💰 Coins: "+player.coins;


}



function loginAdmin(){

let u=document.getElementById("user").value;

let p=document.getElementById("pass").value;


if(u=="admin" && p=="12345"){

hideAll();

document.getElementById("adminPanel").classList.remove("hide");

}

else{

alert("Wrong Login");

}

}
function viewPlayers(){

let players =
JSON.parse(localStorage.getItem("players")) || [];

let data="<h2>👥 PLAYERS</h2>";

players.forEach(p=>{

data+=`

<div>

<p>👤 ${p.name}</p>

<p>UID: ${p.uid}</p>

<p>💰 Coins: ${p.coins}</p>

</div>

`;

});


document.getElementById("adminData").innerHTML=data;

}

  function addCoinsBox(){

document.getElementById("adminData").innerHTML=`

<h2>💰 ADD COINS</h2>

<input id="coinUID" placeholder="Player UID">

<input id="coinAmount" placeholder="Coins Amount">

<button onclick="addCoins()">
ADD COINS
</button>

`;

}



function addCoins(){

let uid=document.getElementById("coinUID").value;

let amount=Number(document.getElementById("coinAmount").value);


let player =
JSON.parse(localStorage.getItem("player"));


if(player && player.uid==uid){

player.coins += amount;


localStorage.setItem(
"player",
JSON.stringify(player)
);


alert("Coins Added 💰");

}

else{

alert("Player Not Found");

}

}
function createTournamentBox(){

document.getElementById("adminData").innerHTML=`

<h2>🏆 CREATE TOURNAMENT</h2>

<input id="tName" placeholder="Tournament Name">

<input id="tFee" placeholder="Entry Fee">

<input id="tPrize" placeholder="Prize">

<input id="tSlots" placeholder="Total Slots">


<button onclick="createTournament()">
CREATE
</button>

`;

}



function createTournament(){

let tournament={

name:document.getElementById("tName").value,

fee:Number(document.getElementById("tFee").value),

prize:document.getElementById("tPrize").value,

slots:Number(document.getElementById("tSlots").value)

};


localStorage.setItem(
"tournament",
JSON.stringify(tournament)
);


alert("Tournament Created 🏆");

}
  function manageTournament(){

let t = JSON.parse(localStorage.getItem("tournament"));

if(!t){
document.getElementById("adminData").innerHTML =
"<h2>No Tournament Created</h2>";
return;
}

document.getElementById("adminData").innerHTML = `

<h2>⚙️ MANAGE TOURNAMENT</h2>

<p>🏆 Name: ${t.name}</p>
<p>💰 Fee: ${t.fee}</p>
<p>🎁 Prize: ${t.prize}</p>
<p>👥 Slots: ${t.slots}</p>

<button onclick="deleteTournament()">
❌ DELETE TOURNAMENT
</button>

`;

}


function deleteTournament(){

localStorage.removeItem("tournament");

alert("Tournament Deleted");

}
  function joinTournament(){

let player =
JSON.parse(localStorage.getItem("player"));

let t =
JSON.parse(localStorage.getItem("tournament"));


if(!player){
alert("Login Player First");
return;
}


if(!t){
alert("No Tournament Available");
return;
}


if(player.coins < t.fee){

alert("Not Enough Coins");
return;

}


player.coins -= t.fee;


localStorage.setItem(
"player",
JSON.stringify(player)
);


let joined =
JSON.parse(localStorage.getItem("joined")) || [];


joined.push({

name:player.name,
uid:player.uid,
tournament:t.name

});


localStorage.setItem(
"joined",
JSON.stringify(joined)
);


alert("Tournament Joined 🎮");

  }
  function viewJoinedPlayers(){

let joined =
JSON.parse(localStorage.getItem("joined")) || [];

let data="<h2>👥 JOINED PLAYERS</h2>";

if(joined.length==0){

data+="<p>No Players Joined</p>";

}

joined.forEach(p=>{

data+=`

<div>

<p>👤 ${p.name}</p>
<p>UID: ${p.uid}</p>
<p>🏆 ${p.tournament}</p>

<hr>

</div>

`;

});


document.getElementById("adminData").innerHTML=data;

  }
  function matchResultBox(){

document.getElementById("adminData").innerHTML=`

<h2>🏆 MATCH RESULT</h2>

<input id="winnerUID" placeholder="Winner UID">

<input id="winPrize" placeholder="Prize Coins">

<button onclick="giveWinner()">
GIVE WIN
</button>

`;

}



function giveWinner(){

let uid =
document.getElementById("winnerUID").value;

let prize =
Number(document.getElementById("winPrize").value);


let players =
JSON.parse(localStorage.getItem("players")) || [];


let found=false;


players.forEach(p=>{

if(p.uid==uid){

p.coins += prize;
found=true;

}

});


localStorage.setItem(
"players",
JSON.stringify(players)
);


let player =
JSON.parse(localStorage.getItem("player"));


if(player && player.uid==uid){

player.coins += prize;

localStorage.setItem(
"player",
JSON.stringify(player)
);

}


if(found){

let winners =
JSON.parse(localStorage.getItem("winners")) || [];

winners.push({
name: uid,
uid: uid,
prize: prize,
date: new Date().toLocaleDateString()
});

localStorage.setItem(
"winners",
JSON.stringify(winners)
);


alert("Winner Reward Added 🏆");

}
else{

alert("Player Not Found");

}

function viewWinners(){

let winners =
JSON.parse(localStorage.getItem("winners")) || [];

let data="<h2>🏆 WINNERS</h2>";


if(winners.length==0){

data+="<p>No Winners Yet</p>";

}


winners.forEach(w=>{

data+=`

<div>

<p>👑 ${w.name}</p>
<p>UID: ${w.uid}</p>
<p>💰 Prize: ${w.prize}</p>
<p>📅 ${w.date}</p>

<hr>

</div>

`;

});


document.getElementById("adminData").innerHTML=data;

}
  function createRoomBox(){

document.getElementById("adminData").innerHTML=`

<h2>⭐ CREATE STAR ROOM</h2>

<input id="roomName" placeholder="Room Name">

<input id="roomID" placeholder="Room ID">

<input id="roomPass" placeholder="Room Password">


<button onclick="createRoom()">
CREATE ROOM
</button>

`;

}



function createRoom(){

let rooms =
JSON.parse(localStorage.getItem("rooms")) || [];


let room={

name:document.getElementById("roomName").value,

id:document.getElementById("roomID").value,

pass:document.getElementById("roomPass").value,

status:"Active"

};


rooms.push(room);


localStorage.setItem(
"rooms",
JSON.stringify(rooms)
);


alert("Star Room Created ⭐");

}
  function viewRooms(){

let rooms =
JSON.parse(localStorage.getItem("rooms")) || [];


let data="<h2>⭐ STAR ROOMS</h2>";


if(rooms.length==0){

data+="<p>No Rooms Available</p>";

}


rooms.forEach(r=>{

if(r.status=="Active"){

data+=`

<div>

<p>⭐ ${r.name}</p>

<p>🆔 Room ID: ${r.id}</p>

<p>🔑 Password: ${r.pass}</p>

</div>

<hr>

`;

}

});


document.getElementById("tournamentData").innerHTML=data;

  }
function logout(){

location.reload();

}


</script>


</body>
</html>
