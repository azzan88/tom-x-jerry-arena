<!DOCTYPE html>
<html>
<head>

<title>TOM X JERRY ARENA</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
box-sizing:border-box;
font-family:Arial;
}

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#050505,#350000);
color:white;
}

.container{
width:90%;
max-width:400px;
background:#111;
padding:25px;
border-radius:20px;
text-align:center;
box-shadow:0 0 25px red;
}

h1{
color:#ffcc00;
}

input{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:10px;
background:#222;
color:white;
}

button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:10px;
background:linear-gradient(45deg,#ff0000,#ff8800);
color:white;
font-size:17px;
font-weight:bold;
}

.card{
background:#222;
padding:15px;
border-radius:15px;
margin-top:15px;
}

#dashboard,
#tournamentBox,
#matches{
display:none;
}

</style>

</head>


<body>


<div class="container">


<div id="login">

<h1>🔥 TOM X JERRY ARENA 🔥</h1>

<p>Free Fire Tournament App</p>

<h2>🎮 Player Login</h2>


<input id="uid" placeholder="Enter Free Fire UID">

<input id="name" placeholder="Enter Player Name">


<button onclick="login()">
LOGIN
</button>


<p id="msg"></p>

</div>



<div id="dashboard">


<h1>🔥 DASHBOARD 🔥</h1>


<div class="card">

<h2 id="pname"></h2>

<p id="puid"></p>

<h2 id="pcoins"></h2>

</div>



<button onclick="showTournament()">
🏆 JOIN TOURNAMENT
</button>


<button onclick="showMatches()">
🎮 MY MATCHES
</button>


<button onclick="logout()">
🚪 LOGOUT
</button>



<div id="tournamentBox">


<div class="card">

<h2>🔥 Free Fire Solo Tournament</h2>

<p>💰 Entry Fee: 50 Coins</p>

<p>🏆 Prize: 500 Coins</p>


<button onclick="joinTournament()">
JOIN NOW
</button>


</div>


</div>




<div id="matches">


<div class="card">

<h2>🎮 My Matches</h2>

<p>No matches joined yet</p>

</div>


</div>



</div>



</div>



<script>


const SUPABASE_URL =
"https://mowzllkumktnobpplulj.supabase.co";


const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vd3psbGt1bWt0bm9icHBsdWxqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3ODQwODYsImV4cCI6MjEwNjM2MDA4Nn0.nzdeQjnLfXLhXjPlwgDj5nQ1nXofSDi1K2lCZ0V-AiE";




async function login(){


let uid=document.getElementById("uid").value.trim();

let name=document.getElementById("name").value.trim();

let msg=document.getElementById("msg");


if(uid=="" || name==""){

msg.innerHTML="⚠️ UID aur Name likho";

return;

}


msg.innerHTML="⏳ Checking...";



let res = await fetch(

SUPABASE_URL+
"/rest/v1/players?uid=eq."+uid,

{

headers:{

"apikey":SUPABASE_KEY,

"Authorization":"Bearer "+SUPABASE_KEY

}

});


let data = await res.json();



if(data.length > 0){


document.getElementById("login").style.display="none";

document.getElementById("dashboard").style.display="block";



document.getElementById("pname").innerHTML=
"👤 "+data[0].name;


document.getElementById("puid").innerHTML=
"UID: "+data[0].uid;


document.getElementById("pcoins").innerHTML=
"💰 Coins: "+data[0].coins;


}


else{


msg.innerHTML="❌ Player not found";


}



}




function showTournament(){

document.getElementById("tournamentBox").style.display="block";

}



function joinTournament(){

alert("✅ Tournament Joined Successfully");

}



function showMatches(){

document.getElementById("matches").style.display="block";

}



function logout(){

location.reload();

}



</script>


</body>
</html>
