async function loginPlayer(){

let name=document.getElementById("pName").value;

let uid=document.getElementById("pUID").value;

password:password,

};

"player",
JSON.stringify(player)
);

.from("players")
.select("*")
.eq("uid",uid)
.limit(1);

if(error){
console.log(error);
}

if(!onlinePlayer || onlinePlayer.length == 0){

let {data:newPlayer,error:insertError} = await supabaseClient
.from("players")
.insert([
{
name:name,
uid:uid,
password:password,
coins:100
}
])
.select();

alert("Wrong Password ❌");
return;

}

}

JSON.parse(localStorage.getItem("players")) || [];

"player",

.from("players")
.select("matches,wins")
.eq("uid",uid)
.single();

player.wins = onlineStats.wins || 0;

async function addCoins(){

let uid=document.getElementById("coinUID").value;

let amount=Number(document.getElementById("coinAmount").value);


if(uid=="" || amount<=0){

alert("Fill Details");
return;

}


let {data:player,error}=await supabaseClient
.from("players")
.select("*")
.eq("uid",uid)
.single();


if(error){

alert("Player Not Found");
return;

}


let newCoins = player.coins + amount;


let {error:updateError}=await supabaseClient
.from("players")
.update({
coins:newCoins
})
.eq("uid",uid);


if(updateError){

alert("Update Error");
console.log(updateError);
return;

}


alert("Coins Added 💰");

}



function deleteTournament(){

  function changeTournamentStatus(){

let t =
JSON.parse(localStorage.getItem("tournament"));


if(t.status=="Upcoming"){

t.status="Live";

}
else if(t.status=="Live"){

t.status="Completed";

}
else{

t.status="Upcoming";

}


localStorage.setItem(
"tournament",
JSON.stringify(t)
);


alert("Status Updated 🔄");

  }
  async function joinTournament(){

let player =
JSON.parse(localStorage.getItem("player"));

let t =
JSON.parse(localStorage.getItem("tournament"));


if(!player){

alert("Login Player First");
return;

}


if(!t){

alert("No Tournament Available");
return;

}


if(t.status=="Completed"){

alert("Tournament Finished");

return;

}


let joined =
JSON.parse(localStorage.getItem("joined")) || [];


let already = joined.find(
p=>p.uid==player.uid && p.tournament==t.name
);


if(already){

alert("Already Joined");

return;

}


if(joined.length >= t.slots){

alert("Slots Full");

return;

}


if(player.coins < t.fee){

alert("Not Enough Coins");

return;

}


player.coins -= t.fee;


localStorage.setItem(
"player",
JSON.stringify(player)
);


joined.push({

name:player.name,
uid:player.uid,
tournament:t.name

});


localStorage.setItem(
"joined",
JSON.stringify(joined)
);
await supabaseClient
.from("joined_players")
.insert([
{
name: player.name,
uid: player.uid,
tournament: t.name
}
]);

t.joined = joined.length;


localStorage.setItem(
"tournament",
JSON.stringify(t)
);


alert("Tournament Joined 🎮");

  }

async function giveWinner(){

let uid=document.getElementById("winnerUID").value;

let prize=Number(document.getElementById("winPrize").value);


if(uid=="" || prize<=0){

alert("Fill Details");
return;

}


let {data:player,error}=await supabaseClient
.from("players")
.select("*")
.eq("uid",uid)
.single();


if(error || !player){

alert("Player Not Found");
return;

}


await supabaseClient
.from("players")
.update({

coins:(player.coins||0)+prize,

wins:(player.wins||0)+1,

matches:(player.matches||0)+1

})
.eq("uid",uid);

let winners =
JSON.parse(localStorage.getItem("winners")) || [];

winners.push({

name: player.name,
uid: player.uid,
prize: prize,
date: new Date().toLocaleDateString()

});

localStorage.setItem(
"winners",
JSON.stringify(winners)
);

alert("Winner Updated 🏆");

}

function sendCoinRequest(){

let player =
JSON.parse(localStorage.getItem("player"));


let requests =
JSON.parse(localStorage.getItem("coinRequests")) || [];


let req={

name:player.name,

uid:player.uid,

amount:Number(document.getElementById("buyAmount").value),

transaction:document.getElementById("transactionID").value,

status:"Pending"

};


requests.push(req);


localStorage.setItem(
"coinRequests",
JSON.stringify(requests)
);


alert("Request Sent 💰");

}
  function viewCoinRequests(){

let requests =
JSON.parse(localStorage.getItem("coinRequests")) || [];

let data="<h2>💰 COIN REQUESTS</h2>";


if(requests.length==0){

data+="<p>No Requests</p>";

}


requests.forEach((r,i)=>{

data+=`

<div>

<p>👤 ${r.name}</p>
<p>UID: ${r.uid}</p>
<p>💰 Amount: ${r.amount}</p>
<p>🧾 ID: ${r.transaction}</p>
<p>Status: ${r.status}</p>


<button onclick="approveRequest(${i})">
✅ APPROVE
</button>


<button onclick="rejectRequest(${i})">
❌ REJECT
</button>


</div>

<hr>

`;

});


document.getElementById("adminData").innerHTML=data;

}



function approveRequest(index){

let requests =
JSON.parse(localStorage.getItem("coinRequests"));


let r=requests[index];


let players =
JSON.parse(localStorage.getItem("players")) || [];


players.forEach(p=>{

if(p.uid==r.uid){

p.coins += r.amount;

}

});


localStorage.setItem(
"players",
JSON.stringify(players)
);


requests[index].status="Approved";


localStorage.setItem(
"coinRequests",
JSON.stringify(requests)
);


alert("Coins Added 💰");

}



function rejectRequest(index){

let requests =
JSON.parse(localStorage.getItem("coinRequests"));


requests[index].status="Rejected";


localStorage.setItem(
"coinRequests",
JSON.stringify(requests)
);


alert("Request Rejected");

}
