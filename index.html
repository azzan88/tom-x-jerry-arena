<!DOCTYPE html>
<html>
<head>

<title>🔥 TOM X JERRY ARENA 🔥</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
box-sizing:border-box;
font-family:Arial;
}

body{
margin:0;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#000,#700000);
color:white;
}

.container{
width:95%;
max-width:420px;
background:#111;
padding:20px;
border-radius:20px;
box-shadow:0 0 25px red;
text-align:center;
}

h1{
color:#ffcc00;
}

input,button{
width:100%;
padding:13px;
margin:8px 0;
border:none;
border-radius:10px;
}

input{
background:#222;
color:white;
}

button{
background:linear-gradient(45deg,red,orange);
color:white;
font-weight:bold;
}

.card{
background:#222;
padding:15px;
border-radius:15px;
margin-top:15px;
}

.hide{
display:none;
}

</style>

</head>


<body>


<div class="container">


<div id="home">

<h1>🔥 TOM X JERRY ARENA 🔥</h1>

<p>Free Fire Tournament Platform</p>

<button onclick="openPlayer()">
🎮 PLAYER LOGIN
</button>

<button onclick="openAdmin()">
👑 ADMIN LOGIN
</button>

</div>



<div id="playerLogin" class="hide">

<h1>🎮 Player Login</h1>

<input id="pName" placeholder="Player Name">

<input id="pUID" placeholder="Free Fire UID">

<button onclick="playerLogin()">
LOGIN
</button>

</div>




<div id="adminLogin" class="hide">

<h1>👑 Admin Login</h1>

<input id="aUser" placeholder="Username">

<input id="aPass" placeholder="Password">

<button onclick="adminLogin()">
LOGIN
</button>

</div>



<div id="playerPanel" class="hide">

<h1>🔥 PLAYER PANEL 🔥</h1>

<div class="card">

<h2 id="playerNameShow"></h2>

<p id="uidShow"></p>

<p id="coinsShow"></p>

</div>


<div id="playerData"></div>
<button onclick="viewRooms()">
⭐ VIEW STAR ROOM
</button>

<button onclick="logout()">
🚪 LOGOUT
</button>

</div>





<div id="adminPanel" class="hide">

<h1>👑 ADMIN PANEL 👑</h1>

<div class="card">

<button onclick="viewPlayers()">
👥 VIEW PLAYERS
</button>


<button onclick="createTournamentBox()">
🏆 CREATE TOURNAMENT
</button>


<button onclick="manageTournament()">
🗑️ MANAGE TOURNAMENT
</button>


<button onclick="addCoinsBox()">
💰 ADD COINS
</button>


<button onclick="createRoomBox()">
⭐ CREATE STAR ROOM
</button>

</div>


<div id="adminData"></div>


<button onclick="logout()">
🚪 LOGOUT
</button>

</div>


</div>





<script>
let players =
JSON.parse(localStorage.getItem("players")) || [];


let tournaments =
JSON.parse(localStorage.getItem("tournaments")) || [];


let rooms =
JSON.parse(localStorage.getItem("rooms")) || [];


let joined =
JSON.parse(localStorage.getItem("joined")) || [];


let currentPlayer=null;



function hideAll(){

document.getElementById("home").style.display="none";

document.getElementById("playerLogin").style.display="none";

document.getElementById("adminLogin").style.display="none";

document.getElementById("playerPanel").style.display="none";

document.getElementById("adminPanel").style.display="none";

}



function openPlayer(){

hideAll();

document.getElementById("playerLogin").style.display="block";

}



function openAdmin(){

hideAll();

document.getElementById("adminLogin").style.display="block";

}



function playerLogin(){

let name=pName.value;

let uid=pUID.value;


if(name=="" || uid==""){

alert("Fill all details");
return;

}


let player=players.find(p=>p.uid==uid);


if(!player){

player={
name:name,
uid:uid,
coins:100
};


players.push(player);


localStorage.setItem(
"players",
JSON.stringify(players)
);

}


currentPlayer=player;


hideAll();

document.getElementById("playerPanel").style.display="block";


playerNameShow.innerHTML="👤 "+player.name;

uidShow.innerHTML="UID: "+player.uid;

coinsShow.innerHTML="💰 Coins: "+player.coins;


}



function adminLogin(){

if(aUser.value=="admin" && aPass.value=="12345"){


hideAll();

document.getElementById("adminPanel").style.display="block";


}

else{

alert("Wrong Login");

}

}
  function viewPlayers(){

let data="<h2>👥 Players</h2>";

if(players.length==0){

data+="No Players";

}

else{

players.forEach((p)=>{

data+=`

<div class="card">

<h3>👤 ${p.name}</h3>

<p>UID: ${p.uid}</p>

<p>💰 Coins: ${p.coins}</p>

</div>

`;

});

}

adminData.innerHTML=data;

}




function createTournamentBox(){

adminData.innerHTML=`

<div class="card">

<h2>🏆 Create Tournament</h2>

<input id="tName" placeholder="Tournament Name">

<input id="tFee" placeholder="Entry Fee">

<input id="tPrize" placeholder="Prize">

<input id="tSlots" placeholder="Total Slots">


<button onclick="createTournament()">
CREATE
</button>

</div>

`;

}




function createTournament(){

let t={

name:tName.value,

fee:Number(tFee.value),

prize:tPrize.value,

slots:Number(tSlots.value),

joined:0

};


if(!t.name){

alert("Fill details");

return;

}


tournaments.push(t);


localStorage.setItem(
"tournaments",
JSON.stringify(tournaments)
);


alert("Tournament Created 🔥");

adminData.innerHTML="Tournament Created";

}




function manageTournament(){

let data="<h2>🏆 Manage Tournament</h2>";


if(tournaments.length==0){

data+="No Tournament";

}

else{


tournaments.forEach((t,index)=>{


data+=`

<div class="card">

<h3>${t.name}</h3>

<p>Prize: ${t.prize}</p>

<p>Slots: ${t.joined}/${t.slots}</p>


<button onclick="deleteTournament(${index})">

🗑️ DELETE

</button>


</div>

`;


});


}


adminData.innerHTML=data;


}




function deleteTournament(index){

tournaments.splice(index,1);


localStorage.setItem(
"tournaments",
JSON.stringify(tournaments)
);


alert("Tournament Deleted");


manageTournament();

}





function addCoinsBox(){

adminData.innerHTML=`

<div class="card">

<h2>💰 Add Coins</h2>


<input id="coinUID" placeholder="Player UID">


<input id="coinAmount" placeholder="Coins">


<button onclick="addCoins()">

ADD

</button>


</div>

`;

}




function addCoins(){


let p=players.find(
x=>x.uid==coinUID.value
);


if(!p){

alert("Player Not Found");

return;

}


p.coins += Number(coinAmount.value);


localStorage.setItem(
"players",
JSON.stringify(players)
);


alert("Coins Added 💰");


}




function createRoomBox(){

adminData.innerHTML=`

<div class="card">

<h2>⭐ Create Star Room</h2>


<input id="rName" placeholder="Room Name">


<input id="rID" placeholder="Room ID">


<input id="rPass" placeholder="Password">


<button onclick="createRoom()">

CREATE ROOM

</button>


</div>

`;

}




function createRoom(){


let room={

name:rName.value,

id:rID.value,

pass:rPass.value

};


rooms.push(room);


localStorage.setItem(
"rooms",
JSON.stringify(rooms)
);


alert("Star Room Created ⭐");


}




function logout(){

location.reload();

}



</script>


</body>

</html>
