<!DOCTYPE html>
<html>
<head>

<title>TOM X JERRY ARENA</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
box-sizing:border-box;
font-family:Arial;
}

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#050505,#350000);
color:white;
}

.container{
width:90%;
max-width:400px;
background:#111;
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 0 25px red;
}

h1{
color:#ffcc00;
}

input{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:10px;
background:#222;
color:white;
font-size:16px;
}

button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:10px;
background:linear-gradient(45deg,#ff0000,#ff8800);
color:white;
font-size:18px;
font-weight:bold;
}

#dashboard{
display:none;
}

.card{
background:#222;
padding:15px;
border-radius:15px;
margin-top:15px;
}

#msg{
margin-top:15px;
}

</style>

</head>


<body>


<div class="container">


<div id="login">

<h1>🔥 TOM X JERRY ARENA 🔥</h1>

<p>Free Fire Tournament App</p>

<h2>🎮 Player Login</h2>


<input id="uid" placeholder="Enter Free Fire UID">

<input id="name" placeholder="Enter Player Name">


<button onclick="login()">
LOGIN
</button>


<p id="msg"></p>


</div>



<div id="dashboard">

<h1>🔥 Dashboard 🔥</h1>

<div class="card">

<h2 id="pname"></h2>

<p id="puid"></p>

<p id="pcoins"></p>

</div>

</div>



</div>



<script>


const SUPABASE_URL = "https://mowzllkumktnobpplulj.supabase.co";

const SUPABASE_KEY = "YOUR_SUPABASE_KEY_HERE";



async function login(){


let uid=document.getElementById("uid").value.trim();

let name=document.getElementById("name").value.trim();

let msg=document.getElementById("msg");


if(uid=="" || name==""){

msg.innerHTML="⚠️ UID aur Name likho";

return;

}


msg.innerHTML="⏳ Checking...";


let res = await fetch(

SUPABASE_URL+
"/rest/v1/players?uid=eq."+uid+"&name=eq."+name,

{

headers:{

"apikey":SUPABASE_KEY,

"Authorization":"Bearer "+SUPABASE_KEY

}

});


let data = await res.json();



if(data.length > 0){


document.getElementById("login").style.display="none";

document.getElementById("dashboard").style.display="block";


document.getElementById("pname").innerHTML=
"👤 "+data[0].name;


document.getElementById("puid").innerHTML=
"UID: "+data[0].uid;


document.getElementById("pcoins").innerHTML=
"💰 Coins: "+data[0].coins;


}

else{


msg.innerHTML="❌ Player not found";


}



}


</script>


</body>
</html>
