<!DOCTYPE html>
<html>
<head>

<title>TOM X JERRY ARENA</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#000,#400000);
color:white;
font-family:Arial;
}

.container{
width:90%;
max-width:400px;
background:#111;
padding:25px;
border-radius:20px;
box-shadow:0 0 25px red;
text-align:center;
}

input,button{
width:100%;
padding:14px;
margin:8px 0;
border-radius:10px;
border:none;
}

input{
background:#222;
color:white;
}

button{
background:linear-gradient(45deg,red,orange);
color:white;
font-size:16px;
font-weight:bold;
}

.hide{
display:none;
}

.card{
background:#222;
padding:15px;
border-radius:15px;
margin-top:15px;
}

h1{
color:#ffcc00;
}

</style>

</head>

<body>


<div class="container">


<div id="home">

<h1>🔥 TOM X JERRY ARENA 🔥</h1>

<p>Free Fire Tournament Platform</p>

<button onclick="showPlayer()">
🎮 PLAYER LOGIN
</button>

<button onclick="showAdmin()">
👑 ADMIN LOGIN
</button>

</div>



<div id="playerBox" class="hide">

<h1>🎮 Player Login</h1>

<input id="playerName" placeholder="Player Name">

<input id="playerUID" placeholder="Free Fire UID">

<button onclick="playerLogin()">
LOGIN
</button>

<p id="playerMsg"></p>

</div>



<div id="adminBox" class="hide">

<h1>👑 Admin Login</h1>

<input id="adminUser" placeholder="Username">

<input id="adminPass" placeholder="Password">

<button onclick="adminLogin()">
LOGIN
</button>

<p id="adminMsg"></p>

</div>



<div id="dashboard" class="hide">

<h1>🔥 DASHBOARD 🔥</h1>

<div class="card">

<h2 id="showName"></h2>

<p id="showUID"></p>

<p>💰 Coins: 100</p>

</div>


<button>
🏆 JOIN TOURNAMENT
</button>


<button onclick="logout()">
🚪 LOGOUT
</button>


</div>



<div id="adminDashboard" class="hide">

<h1>👑 ADMIN PANEL</h1>

<div class="card">

<h2>Control Panel</h2>

<button onclick="viewPlayers()">
👥 VIEW PLAYERS
</button>
<div id="playerList" class="card hide">

<h2>👥 Players</h2>

<p id="playersData">No players added</p>
</div>
</div>

</div>


</div>



<script>
let players = [];

function hideAll(){

document.getElementById("home").style.display="none";
document.getElementById("playerBox").style.display="none";
document.getElementById("adminBox").style.display="none";
document.getElementById("dashboard").style.display="none";
document.getElementById("adminDashboard").style.display="none";

}



function showPlayer(){

hideAll();

document.getElementById("playerBox").style.display="block";

}



function showAdmin(){

hideAll();

document.getElementById("adminBox").style.display="block";

}



function playerLogin(){

let name=document.getElementById("playerName").value;
let uid=document.getElementById("playerUID").value;


if(name=="" || uid==""){

document.getElementById("playerMsg").innerHTML="Fill all details";

return;

}


players.push({
name:name,
uid:uid
});




hideAll();

document.getElementById("dashboard").style.display="block";

document.getElementById("showName").innerHTML="👤 "+name;

document.getElementById("showUID").innerHTML="UID: "+uid;

}





function adminLogin(){

let user=document.getElementById("adminUser").value;
let pass=document.getElementById("adminPass").value;


if(user=="admin" && pass=="12345"){

hideAll();

document.getElementById("adminDashboard").style.display="block";

}

else{

document.getElementById("adminMsg").innerHTML="Wrong Login";

}


}


function viewPlayers(){

document.getElementById("playerList").style.display="block";

let list="";

players.forEach(function(p){

list += "👤 Name: "+p.name+"<br>🆔 UID: "+p.uid+"<br><br>";

});

if(list==""){
list="No players added";
}

document.getElementById("playersData").innerHTML=list;

}
function logout(){

location.reload();

}


</script>


</body>
</html>
