<!DOCTYPE html>
<html>
<head>

<title>TOM X JERRY ARENA</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#000,#400000);
color:white;
font-family:Arial;
}

.container{
width:90%;
max-width:400px;
background:#111;
padding:25px;
border-radius:20px;
box-shadow:0 0 25px red;
text-align:center;
}

input,button{
width:100%;
padding:14px;
margin:8px 0;
border-radius:10px;
border:none;
}

input{
background:#222;
color:white;
}

button{
background:linear-gradient(45deg,red,orange);
color:white;
font-size:16px;
font-weight:bold;
}

.hide{
display:none;
}

.card{
background:#222;
padding:15px;
border-radius:15px;
margin-top:15px;
}

h1{
color:#ffcc00;
}

</style>

</head>

<body>


<div class="container">


<div id="home">

<h1>🔥 TOM X JERRY ARENA 🔥</h1>

<p>Free Fire Tournament Platform</p>

<button onclick="showPlayer()">
🎮 PLAYER LOGIN
</button>

<button onclick="showAdmin()">
👑 ADMIN LOGIN
</button>

</div>



<div id="playerBox" class="hide">

<h1>🎮 Player Login</h1>

<input id="playerName" placeholder="Player Name">

<input id="playerUID" placeholder="Free Fire UID">

<button onclick="playerLogin()">
LOGIN
</button>

<p id="playerMsg"></p>

</div>



<div id="adminBox" class="hide">

<h1>👑 Admin Login</h1>

<input id="adminUser" placeholder="Username">

<input id="adminPass" placeholder="Password">

<button onclick="adminLogin()">
LOGIN
</button>

<p id="adminMsg"></p>

</div>



<div id="dashboard" class="hide">

<h1>🔥 DASHBOARD 🔥</h1>

<div class="card">

<h2 id="showName"></h2>

<p id="showUID"></p>

<p id="showCoins">💰 Coins: 0</p>

</div>


<button>
🏆 JOIN TOURNAMENT
</button>
<div id="tournamentList" class="card">
<h2>🏆 Available Tournaments</h2>
<p id="tournamentsData">No tournaments available</p>
</div>

<button onclick="logout()">
🚪 LOGOUT
</button>


</div>



<div id="adminDashboard" class="hide">

<h1>👑 ADMIN PANEL</h1>

<div class="card">

<h2>Control Panel</h2>

<button onclick="viewPlayers()">
👥 VIEW PLAYERS
</button>
  <button onclick="viewJoinedPlayers()">
🏆 VIEW JOINED PLAYERS
  </button>
  <button onclick="showCreateTournament()">
🏆 CREATE TOURNAMENT
</button>
<button onclick="viewTournaments()">
🏆 MANAGE TOURNAMENTS
</button>
<div id="tournamentBox" class="card hide">

<h2>🏆 New Tournament</h2>

<input id="tourName" placeholder="Tournament Name">

<input id="tourFee" placeholder="Entry Fee">

<input id="tourPrize" placeholder="Prize">

<button onclick="createTournament()">
CREATE
</button>

</div>
<div id="playerList" class="card hide">

<h2>👥 Players</h2>

<p id="playersData">No players added</p>
</div>
</div>

</div>


</div>



<script>

let players = JSON.parse(localStorage.getItem("players")) || [];
let tournaments = JSON.parse(localStorage.getItem("tournaments")) || [];
let joinedPlayers = JSON.parse(localStorage.getItem("joinedPlayers")) || [];

function hideAll(){

document.getElementById("home").style.display="none";
document.getElementById("playerBox").style.display="none";
document.getElementById("adminBox").style.display="none";
document.getElementById("dashboard").style.display="none";
document.getElementById("adminDashboard").style.display="none";

}


function showPlayer(){

hideAll();

document.getElementById("playerBox").style.display="block";

}


function showAdmin(){

hideAll();

document.getElementById("adminBox").style.display="block";

}


function adminLogin(){

let user=document.getElementById("adminUser").value;
let pass=document.getElementById("adminPass").value;


if(user=="admin" && pass=="12345"){

hideAll();

document.getElementById("adminDashboard").style.display="block";

}
else{

document.getElementById("adminMsg").innerHTML="Wrong Login";

}

}




function playerLogin(){

let name=document.getElementById("playerName").value;
let uid=document.getElementById("playerUID").value;


if(name=="" || uid==""){
document.getElementById("playerMsg").innerHTML="Fill all details";
return;
}


// Check old player
let player = players.find(p => p.uid == uid);


if(!player){

player={
name:name,
uid:uid,
coins:100
};

players.push(player);

localStorage.setItem("players",JSON.stringify(players));

}


// Open dashboard

hideAll();

document.getElementById("dashboard").style.display="block";


document.getElementById("showName").innerHTML="👤 "+player.name;

document.getElementById("showUID").innerHTML="UID: "+player.uid;

document.getElementById("showCoins").innerHTML="💰 Coins: "+player.coins;


// Show tournaments

let tourData="";


if(tournaments.length==0){

tourData="No tournaments available";

}
else{

tournaments.forEach((t)=>{

tourData += `

<div class="card">

<h3>🏆 ${t.name}</h3>

<p>💰 Entry Fee: ${t.fee}</p>

<p>🎁 Prize: ${t.prize}</p>


<button onclick="joinTournament('${t.name}')">
JOIN TOURNAMENT
</button>

</div>

`;

});

}


document.getElementById("tournamentsData").innerHTML=tourData;

}
  function viewTournaments(){

document.getElementById("playerList").style.display="block";

let data="";

if(tournaments.length==0){

data="No tournaments available";

}
else{

tournaments.forEach((t,index)=>{

data += `
<div class="card">

<h3>🏆 ${t.name}</h3>

<p>💰 Fee: ${t.fee}</p>

<p>🎁 Prize: ${t.prize}</p>

<button onclick="deleteTournament(${index})">
🗑️ DELETE
</button>

</div>
`;

});

}

document.getElementById("playersData").innerHTML=data;

  }
  function viewPlayers(){

document.getElementById("playerList").style.display="block";

let data="";

if(players.length==0){

data="No players added";

}
else{

players.forEach((p)=>{

data += `
<div class="card">
<h3>👤 ${p.name}</h3>
<p>UID: ${p.uid}</p>
<p>💰 Coins: ${p.coins}</p>
</div>
`;

});

}

document.getElementById("playersData").innerHTML=data;

  }
function viewJoinedPlayers(){

document.getElementById("playerList").style.display="block";

let data="";

if(joinedPlayers.length==0){

data="No one joined tournament";

}
else{

joinedPlayers.forEach((p)=>{

data += `
<div class="card">
<h3>👤 ${p.name}</h3>
<p>UID: ${p.uid}</p>
<p>🏆 Tournament: ${p.tournament}</p>
</div>
`;

});

}

document.getElementById("playersData").innerHTML=data;

}

function showCreateTournament(){
document.getElementById("tournamentBox").style.display="block";

}

function joinTournament(tourName){

let name=document.getElementById("showName").innerHTML.replace("👤 ","");
let uid=document.getElementById("showUID").innerHTML.replace("UID: ","");

let player = players.find(p => p.uid == uid);

let tournament = tournaments.find(t => t.name == tourName);


// Check already joined
let already = joinedPlayers.find(j => 
j.uid == uid && j.tournament == tourName
);

if(already){

alert("You already joined this tournament ❌");
return;

}


// Check coins

if(player.coins < Number(tournament.fee)){

alert("Not enough coins 💰");
return;

}


// Deduct coins

player.coins -= Number(tournament.fee);


// Save player update

localStorage.setItem("players",JSON.stringify(players));


// Add joined player

joinedPlayers.push({

name:name,
uid:uid,
tournament:tourName

});


localStorage.setItem(
"joinedPlayers",
JSON.stringify(joinedPlayers)
);


alert("Tournament Joined 🔥");


location.reload();

}


function createTournament(){

let name=document.getElementById("tourName").value;
let fee=document.getElementById("tourFee").value;
let prize=document.getElementById("tourPrize").value;


if(name=="" || fee=="" || prize==""){
alert("Fill all details");
return;
}


tournaments.push({
name:name,
fee:fee,
prize:prize
});


localStorage.setItem("tournaments",JSON.stringify(tournaments));


alert("Tournament Created 🔥");

}
  function deleteTournament(index){

let confirmDelete = confirm("Delete this tournament?");

if(confirmDelete){

tournaments.splice(index,1);

localStorage.setItem(
"tournaments",
JSON.stringify(tournaments)
);

alert("Tournament Deleted 🗑️");

location.reload();

}

  }
function logout(){

location.reload();

}

</script>

</body>
</html>
